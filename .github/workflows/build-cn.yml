name: Build Tofa CN for macOS

on:
  push:
    branches: [zh-cn]

permissions:
  contents: read

concurrency:
  group: tofa-cn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'kenneth-bro/tofa'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install verified Tauri CLI
        run: |
          zip="$RUNNER_TEMP/cargo-tauri.zip"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$zip" https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.10.1/cargo-tauri-aarch64-apple-darwin.zip
          printf '%s  %s\n' f89d7d9485d3a6a6bcbc88275b0bddea61fe582ca636fc02c286994af1f6e36b "$zip" | shasum -a 256 -c
          unzip -o "$zip" cargo-tauri -d "$HOME/.cargo/bin"
          cargo tauri --version
      - name: Check and test
        run: |
          node --check tofa-app/src-tauri/ui/js/app.js
          cargo fmt --check --all
          cargo test --locked --workspace
      - name: Build and verify macOS packages
        run: bash scripts/package-macos-cn.sh "$RUNNER_TEMP/tofa-cn"
      - uses: actions/upload-artifact@v4
        with:
          name: tofa-cn-macos-arm64
          path: ${{ runner.temp }}/tofa-cn/
          if-no-files-found: error
